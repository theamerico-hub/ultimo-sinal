<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@400;500;600;700&family=Special+Elite&display=swap">
<style>
:root{--bg:#0b0b0d;--panel:#141418;--panel2:#1b1b21;--line:#2a2a33;--txt:#e8e6e3;--mut:#9a978f;--dim:#6b6962;--red:#c4302b;--good:#4caf6a;--warn:#e0a030;--bad:#d64541}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--txt);font:14px/1.45 Inter,system-ui,sans-serif}
body{background:radial-gradient(ellipse at top,#1a1214 0%,var(--bg) 55%) fixed;min-height:100vh}
button{font:inherit;color:inherit;cursor:pointer}
button:disabled{opacity:.4;cursor:not-allowed}
input,textarea,select{font:inherit;color:var(--txt);background:#0f0f12;border:1px solid var(--line);border-radius:6px}
select{padding:5px 8px}
textarea{width:100%;padding:8px 10px;resize:vertical;min-height:60px}
input[type=number]{width:52px;padding:4px 6px;text-align:center}
input:focus,textarea:focus,select:focus{outline:1px solid var(--red);border-color:var(--red)}
h1,h2,h3{font-family:"Bebas Neue",sans-serif;letter-spacing:.04em;font-weight:400;margin:0}
.small{font-size:12px;color:var(--mut)}
.hidden{display:none!important}

header{position:sticky;top:0;z-index:20;background:rgba(11,11,13,.94);backdrop-filter:blur(6px);border-bottom:1px solid var(--line)}
.bar{display:flex;align-items:center;gap:14px;padding:10px 16px;flex-wrap:wrap}
.logo{font-family:"Bebas Neue";font-size:26px;letter-spacing:.08em;color:#fff;line-height:1}
.logo span{color:var(--red)}
.meta{display:flex;gap:14px;align-items:center;flex-wrap:wrap;margin-left:auto}
.meta label{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--mut);display:flex;align-items:center;gap:6px}
.meta input{width:62px;padding:3px 6px}
.conn{font-size:11px;color:var(--dim);display:flex;align-items:center;gap:6px}
.conn i{width:8px;height:8px;border-radius:50%;background:#555;display:inline-block}
.conn.on i{background:var(--good)} .conn.warn i{background:var(--warn)}
.iconbtn{background:var(--panel2);border:1px solid var(--line);border-radius:6px;padding:5px 10px;font-size:12px}
.iconbtn:hover{border-color:#555}
nav{display:flex;gap:2px;overflow-x:auto;padding:0 10px}
nav button{background:none;border:0;border-bottom:3px solid transparent;padding:8px 12px;font-family:"Bebas Neue";font-size:18px;letter-spacing:.06em;color:var(--mut);white-space:nowrap;display:flex;align-items:center;gap:7px}
nav button.on{color:#fff;border-color:var(--c,var(--red))}
nav .dot{width:7px;height:7px;border-radius:50%;background:var(--good)}
nav .dot.down{background:var(--warn)} nav .dot.dead{background:#555}
main{max-width:1200px;margin:0 auto;padding:18px 16px 120px}
.wrap-narrow{max-width:780px;margin:0 auto}

.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:16px}
.card h3{font-size:20px;color:var(--c,var(--red));margin-bottom:10px}
.b{background:var(--panel2);border:1px solid var(--line);border-radius:7px;padding:6px 11px;font-weight:600;font-size:13px}
.b:hover:not(:disabled){border-color:#555}
.b.dmg{color:#ff8a80} .b.heal{color:#8fe0a3}
.b.pri{background:var(--c,var(--red));border-color:var(--c,var(--red));color:#fff}
.b.on{background:var(--c,var(--red));border-color:var(--c,var(--red));color:#fff}
.btnrow{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.pips{display:flex;gap:4px;align-items:center}
.pip{width:18px;height:18px;border-radius:4px;border:1px solid #3a3a44;background:#101014;padding:0}
.pip.on{background:var(--pc,var(--red));border-color:var(--pc,var(--red))}
.pips .clr{background:none;border:0;color:var(--dim);font-size:12px;padding:0 4px}
.pips.ro .pip{cursor:default}

/* landing */
.land h1{font-size:46px;text-align:center;margin-top:10px}
.land p{text-align:center;color:var(--mut);margin:4px 0 22px}
.pick{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
@media(max-width:700px){.pick{grid-template-columns:repeat(2,1fr)}}
.pick button{position:relative;aspect-ratio:3/4;border-radius:12px;overflow:hidden;border:2px solid var(--line);padding:0;background:#000}
.pick button:hover{border-color:var(--c)}
.pick img{width:100%;height:100%;object-fit:cover;display:block}
.pick .nm{position:absolute;left:0;right:0;bottom:0;padding:30px 12px 10px;background:linear-gradient(transparent,rgba(0,0,0,.95));text-align:left}
.pick .nm b{font-family:"Bebas Neue";font-size:30px;font-weight:400;display:block;line-height:1}
.pick .nm span{font-family:"Bebas Neue";font-size:15px;letter-spacing:.07em;color:var(--c)}
.pick .taken{position:absolute;top:8px;right:8px;background:rgba(0,0,0,.7);border-radius:20px;padding:2px 8px;font-size:11px;color:var(--good)}
.mbtn{display:block;margin:26px auto 0;background:none;border:1px dashed #444;border-radius:10px;padding:10px 18px;color:var(--mut)}
.mbtn:hover{color:#fff;border-color:#777}

/* player */
.ptop{display:flex;gap:14px;align-items:center}
.ptop img{width:84px;height:112px;object-fit:cover;border-radius:10px;border:1px solid var(--line)}
.ptop .info{flex:1;min-width:0}
.ptop h2{font-size:36px;line-height:.95;color:#fff}
.ptop .role{font-family:"Bebas Neue";letter-spacing:.07em;color:var(--c);font-size:16px}
.hpline{display:flex;align-items:baseline;gap:8px;margin-top:6px}
.hpline b{font-family:"Bebas Neue";font-size:30px;font-weight:400}
.hpbar{height:10px;background:#0e0e11;border-radius:6px;overflow:hidden;border:1px solid var(--line);margin-top:4px}
.hpbar i{display:block;height:100%;background:var(--c);transition:width .25s}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.chip{font-size:11px;border:1px solid var(--line);border-radius:20px;padding:2px 9px;color:var(--mut)}
.chip.w{color:var(--warn);border-color:rgba(224,160,48,.4)} .chip.r{color:#ff8a80;border-color:rgba(214,69,65,.4)} .chip.g{color:#b5d96b;border-color:rgba(141,179,58,.4)}
.pedido{border:2px solid var(--red);background:rgba(196,48,43,.08);border-radius:12px;padding:14px;animation:pulse 2s infinite}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(196,48,43,.4)}50%{box-shadow:0 0 0 8px rgba(196,48,43,0)}}
.pedido .t{font-size:11px;text-transform:uppercase;letter-spacing:.1em;color:#ff8a80}
.pedido .q{font-family:"Bebas Neue";font-size:28px;margin:2px 0 10px}
.big{width:100%;padding:16px;border-radius:10px;border:0;background:var(--c);color:#fff;font-family:"Bebas Neue";font-size:28px;letter-spacing:.06em}
.big small{display:block;font-family:Inter;font-size:12px;letter-spacing:0;opacity:.85}
.result{text-align:center;padding:18px 10px}
.result .n{font-family:"Bebas Neue";font-size:96px;line-height:.9;color:#fff}
.result .n.crit{color:var(--good)} .result .n.fail{color:var(--bad)}
.result .lbl{font-family:"Bebas Neue";font-size:22px;letter-spacing:.05em;color:var(--c)}
.result .why{font-size:13px;color:var(--mut);margin-top:4px}
.result .oc{margin-top:6px;font-weight:700;font-size:15px}
.result.roll .n{animation:pop .35s ease-out}
@keyframes pop{0%{transform:scale(.6);opacity:.2}70%{transform:scale(1.08)}100%{transform:scale(1);opacity:1}}
.attrbtns{display:grid;grid-template-columns:repeat(6,1fr);gap:8px}
@media(max-width:820px){.attrbtns{grid-template-columns:repeat(3,1fr)}}@media(max-width:420px){.attrbtns{grid-template-columns:repeat(2,1fr)}}
.attrbtns button{background:var(--panel2);border:1px solid var(--line);border-left:4px solid var(--c);border-radius:10px;padding:12px 8px;text-align:center}
.attrbtns button:hover{background:#22222a;border-color:var(--c)}
.attrbtns .an{font-family:"Bebas Neue";font-size:21px;letter-spacing:.05em;display:block}
.attrbtns .av{font-size:12px;color:var(--mut)}
.mods{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-top:12px}
.step{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--mut)}
.step b{min-width:26px;text-align:center;color:#fff;font-size:16px}
.weap{display:flex;align-items:center;gap:8px;padding:9px 0;border-bottom:1px solid var(--line);flex-wrap:wrap}
.weap:last-child{border-bottom:0}
.weap .wn{flex:1;min-width:120px;font-weight:600}
.weap .wn small{display:block;font-weight:400;color:var(--mut)}
.dicegrid{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
@media(max-width:620px){.dicegrid{grid-template-columns:repeat(4,1fr)}}
.dicegrid button{background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:10px 0;font-family:"Bebas Neue";font-size:20px;letter-spacing:.04em}
.dicegrid button:hover{border-color:var(--c,#666)}
.stack{display:flex;flex-direction:column;gap:14px}
details.card summary{cursor:pointer;font-family:"Bebas Neue";font-size:20px;color:var(--c);list-style:none}
details.card summary::-webkit-details-marker{display:none}
details .ro{white-space:pre-wrap;color:#c9c6c0;font-size:13px;margin:8px 0}
.warnbox{border:1px solid rgba(224,160,48,.5);background:rgba(224,160,48,.07);border-radius:10px;padding:10px 12px;font-size:13px}

/* feed */
.feed{display:flex;flex-direction:column;gap:2px;max-height:460px;overflow:auto}
.fi{display:grid;grid-template-columns:8px 1fr auto;gap:10px;align-items:center;padding:7px 4px;border-bottom:1px solid #1f1f26}
.fi .c{width:8px;height:32px;border-radius:3px}
.fi .w{font-size:13px}.fi .w b{font-weight:600}
.fi .d{font-size:11px;color:var(--dim)}
.fi .tot{font-family:"Bebas Neue";font-size:28px;min-width:40px;text-align:right}
.fi .tot.crit{color:var(--good)} .fi .tot.fail{color:var(--bad)}
.fi.secret{background:repeating-linear-gradient(45deg,transparent,transparent 6px,rgba(255,255,255,.02) 6px,rgba(255,255,255,.02) 12px)}
.fi .oc{font-size:11px;font-weight:700;margin-left:6px}
.oc-ex{color:var(--good)} .oc-ok{color:#8fe0a3} .oc-cs{color:var(--warn)} .oc-f{color:var(--bad)}
.fi.new{animation:flash 1.2s}
@keyframes flash{from{background:rgba(196,48,43,.25)}to{background:transparent}}

/* initiative */
.inilist{display:flex;flex-direction:column;gap:4px}
.ini-i{display:flex;align-items:center;gap:10px;padding:6px 10px;border-radius:8px;background:var(--panel2);border:1px solid var(--line);border-left:3px solid var(--c)}
.ini-i[data-act]{cursor:pointer}
.ini-i.cur{background:rgba(196,48,43,.14);border-color:var(--red);border-left-color:var(--c)}
.ini-v{font-family:"Bebas Neue";font-size:24px;min-width:30px;text-align:center}
.ini-n{flex:1;font-weight:600}
.ini-t{font-size:10px;text-transform:uppercase;letter-spacing:.08em;background:var(--red);color:#fff;border-radius:4px;padding:1px 6px}
.ini-i .clr{background:none;border:0;color:var(--dim)}
/* master mesa */
.mgrid{display:grid;grid-template-columns:1.1fr .9fr;gap:16px}
@media(max-width:900px){.mgrid{grid-template-columns:1fr}}
.sel{display:flex;gap:6px;flex-wrap:wrap}
.sel button{background:var(--panel2);border:1px solid var(--line);border-radius:20px;padding:5px 12px;font-size:13px}
.sel button.on{background:var(--red);border-color:var(--red);color:#fff}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-top:10px}
.row>label{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--mut);min-width:60px}
.resp{margin-top:12px;border-top:1px solid var(--line);padding-top:10px}
.resp .r{display:flex;justify-content:space-between;padding:4px 0;font-size:13px}
.party{display:flex;flex-direction:column;gap:8px}
.pm{display:grid;grid-template-columns:44px 1fr auto;gap:10px;align-items:center;background:var(--panel2);border:1px solid var(--line);border-left:3px solid var(--c);border-radius:9px;padding:7px 10px}
.pm img{width:44px;height:58px;object-fit:cover;border-radius:6px}
.pm .n{font-weight:600;display:flex;align-items:center;gap:6px}
.pm .n i{width:7px;height:7px;border-radius:50%;background:#444;display:inline-block}
.pm .n i.on{background:var(--good)}
.pm .s{font-size:12px;color:var(--mut)}
.pm .hpv{font-family:"Bebas Neue";font-size:24px;color:#fff;margin-right:4px}
.pm .ctl{display:flex;gap:4px;align-items:center}
.pm .ctl .b{padding:3px 8px}
.toggle{display:flex;align-items:center;gap:8px;font-size:13px;cursor:pointer;user-select:none}
.toggle input{accent-color:var(--red);width:16px;height:16px}

/* master sheet (reused) */
.sheet{display:grid;grid-template-columns:290px 1fr;gap:18px}
@media(max-width:860px){.sheet{grid-template-columns:1fr}}
.portrait{position:relative;border-radius:10px;overflow:hidden;border:1px solid var(--line);aspect-ratio:3/4;background:#000}
.portrait img{width:100%;height:100%;object-fit:cover;display:block}
.portrait::after{content:"";position:absolute;inset:0;background:linear-gradient(transparent 55%,rgba(0,0,0,.92))}
.portrait .nm{position:absolute;left:14px;bottom:12px;z-index:2}
.portrait .nm h2{font-size:42px;line-height:.9;color:#fff}
.portrait .nm div{font-family:"Bebas Neue";font-size:18px;letter-spacing:.08em;color:var(--c)}
.portrait.dead img{filter:grayscale(1) brightness(.5)} .portrait.down img{filter:saturate(.4) brightness(.75)}
.status{display:inline-block;margin-top:10px;padding:4px 10px;border-radius:20px;font-size:12px;font-weight:600}
.st-ok{background:rgba(76,175,106,.15);color:var(--good)} .st-down{background:rgba(224,160,48,.15);color:var(--warn)}
.st-stab{background:rgba(120,160,220,.15);color:#8fb3e8} .st-dead{background:#222;color:#888}
.hpbox{display:flex;gap:18px;align-items:center;flex-wrap:wrap}
.hpnum{font-family:"Bebas Neue";font-size:60px;line-height:.85;color:#fff;min-width:110px}
.hpnum small{font-size:26px;color:var(--dim)}
.dying{margin-top:12px;padding:10px 12px;border:1px dashed var(--warn);border-radius:8px;background:rgba(224,160,48,.06)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px} .grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
@media(max-width:860px){.grid2,.grid3{grid-template-columns:1fr}}
.track{display:flex;flex-direction:column;gap:6px}
.track .lbl{display:flex;justify-content:space-between;font-size:12px;text-transform:uppercase;letter-spacing:.07em;color:var(--mut)}
.track .eff{font-size:12px;min-height:17px}
.attrs{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}
@media(max-width:560px){.attrs{grid-template-columns:repeat(3,1fr)}}
.attr{background:#0f0f12;border:1px solid var(--line);border-radius:8px;padding:8px 6px;text-align:center}
.attr .n{font-size:10px;text-transform:uppercase;letter-spacing:.08em;color:var(--mut)}
.attr input{width:44px;font-family:"Bebas Neue";font-size:26px;background:none;border:0;padding:0}
.derived{display:flex;gap:18px;margin-top:12px;flex-wrap:wrap;font-size:12px;color:var(--mut)}
.derived b{font-family:"Bebas Neue";font-size:22px;color:#fff;margin-left:4px;font-weight:400}
.pen{margin-top:10px;font-size:12px;color:#ff9e80}
.fld{margin-top:12px}
.fld label{display:block;font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--mut);margin-bottom:4px}
.counter{display:flex;align-items:center;gap:8px}
.counter .v{font-family:"Bebas Neue";font-size:26px;min-width:30px;text-align:center}
.counter input.nm{width:120px;padding:3px 6px;font-size:12px}
.npcgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:14px}
.npc{background:var(--panel);border:1px solid var(--line);border-radius:10px;overflow:hidden;display:flex;flex-direction:column}
.npc .ph{height:180px;background:#000}
.npc .ph img{width:100%;height:100%;object-fit:cover;object-position:center 20%}
.npc .ph .ini{display:flex;align-items:center;justify-content:center;height:100%;font-family:"Bebas Neue";font-size:52px;color:#333;background:repeating-linear-gradient(45deg,#111,#111 8px,#141414 8px,#141414 16px)}
.npc .bd{padding:12px;display:flex;flex-direction:column;gap:8px;flex:1}
.npc h3{font-size:22px;color:#fff}
.npc .role{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--mut)}
.npc p{margin:0;font-size:13px;color:#c9c6c0}
.mini{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--mut)}
.mini .hpv{font-family:"Bebas Neue";font-size:22px;color:#fff}
.mini input{width:46px;padding:2px 4px} .mini .b{padding:3px 8px}
table{width:100%;border-collapse:collapse}
th,td{text-align:left;padding:8px 6px;border-bottom:1px solid var(--line);font-size:13px;vertical-align:middle}
th{font-size:11px;text-transform:uppercase;letter-spacing:.07em;color:var(--mut);font-weight:500}
td input.en{width:130px;padding:3px 6px;background:transparent;border-color:transparent}
tr.dead td{opacity:.4;text-decoration:line-through}
.minibar{width:80px;height:7px;border-radius:4px;background:#0e0e11;border:1px solid var(--line);overflow:hidden;display:inline-block;vertical-align:middle;margin-left:6px}
.minibar i{display:block;height:100%;background:var(--bad)}
.tablewrap{overflow-x:auto}
.sec-title{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin:26px 0 8px}
.sec-title h2{font-size:30px}

/* rules */
.rules{max-width:880px;margin:0 auto}
.rules section{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:18px 20px;margin-bottom:14px}
.rules h2{font-size:28px;color:var(--red);margin-bottom:6px}
.rules h4{margin:14px 0 4px;font-size:14px}
.rules p,.rules li{color:#d3d0ca}
.rules ul{padding-left:20px;margin:6px 0}
.rules .new{font-size:10px;background:var(--red);color:#fff;border-radius:4px;padding:1px 6px;margin-left:8px;vertical-align:middle;font-family:Inter}
.formula{font-family:"Special Elite";font-size:17px;background:#0f0f12;border-left:3px solid var(--red);padding:8px 12px;margin:8px 0}
.toc{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:16px}
.toc a{font-size:12px;color:var(--mut);text-decoration:none;border:1px solid var(--line);border-radius:20px;padding:3px 10px}

/* master dice tray */
.tray{position:fixed;right:14px;bottom:14px;z-index:30;background:rgba(20,20,24,.97);border:1px solid var(--line);border-radius:12px;width:290px;box-shadow:0 10px 30px rgba(0,0,0,.6)}
.tray .hd{display:flex;justify-content:space-between;align-items:center;padding:8px 12px;border-bottom:1px solid var(--line);cursor:pointer}
.tray .hd h3{font-size:18px}
.tray .bd{padding:10px 12px}
.tray.min .bd{display:none}
.tray .res{font-family:"Bebas Neue";font-size:42px;text-align:center;line-height:1;margin:8px 0 2px}
.tray .res.crit{color:var(--good)} .tray .res.fail{color:var(--bad)}
.tray .why{text-align:center;font-size:12px;color:var(--mut);min-height:16px}

.modal{position:fixed;inset:0;background:rgba(0,0,0,.75);z-index:50;display:none;align-items:center;justify-content:center;padding:20px}
.modal.on{display:flex}
.modal .box{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:20px;max-width:420px;width:100%}
.modal .box.wide{max-width:560px}
.pin{font-size:28px;letter-spacing:.4em;text-align:center;width:100%;padding:10px;margin:10px 0}
.modal textarea{min-height:150px;font-family:monospace;font-size:11px}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#222;border:1px solid #444;padding:8px 14px;border-radius:8px;font-size:13px;z-index:60;opacity:0;transition:opacity .2s;pointer-events:none;max-width:90vw;text-align:center}
.toast.on{opacity:1}
</style>
</head>
<body>
<header>
  <div class="bar">
    <div class="logo">ÚLTIMO <span>SINAL</span></div>
    <div class="meta" id="meta"></div>
  </div>
  <nav id="tabs" class="hidden"></nav>
</header>
<main id="view"></main>

<div class="tray hidden" id="tray">
  <div class="hd" id="trayHd"><h3>Dados do mestre</h3><span class="small" id="trayTog">recolher</span></div>
  <div class="bd">
    <div class="btnrow">
      <button class="b" data-mdie="20">D20</button><button class="b" data-mdie="4">D4</button><button class="b" data-mdie="6">D6</button><button class="b" data-mdie="8">D8</button><button class="b" data-mdie="10">D10</button><button class="b" data-mdie="100">D100</button>
    </div>
    <div class="btnrow" style="margin-top:8px;font-size:12px;color:var(--mut)">Mod <input type="number" id="mMod" value="0"> DIF <input type="number" id="mDif" placeholder="—"></div>
    <label class="toggle" style="margin-top:8px"><input type="checkbox" id="mSecret" checked> Rolagens do mestre secretas</label>
    <div class="res" id="mRes">—</div>
    <div class="why" id="mWhy">os jogadores só veem se “secretas” estiver desmarcado</div>
  </div>
</div>

<div class="modal" id="pinModal">
  <div class="box">
    <h2 style="font-size:28px" id="pinTitle">Área do Mestre</h2>
    <p class="small" id="pinMsg" style="margin:4px 0 0"></p>
    <input class="pin" id="pinIn" type="password" inputmode="numeric" pattern="[0-9]*" maxlength="12" autocomplete="off">
    <input class="pin hidden" id="pinIn2" type="password" inputmode="numeric" pattern="[0-9]*" maxlength="12" autocomplete="off" placeholder="repita">
    <div class="btnrow" style="justify-content:space-between"><button class="b" id="pinCancel">Cancelar</button><button class="b pri" id="pinOk">Entrar</button></div>
    <p class="small" id="pinErr" style="color:#ff8a80;margin-bottom:0"></p>
  </div>
</div>

<div class="modal" id="bkModal">
  <div class="box wide">
    <h2 style="font-size:26px;margin-bottom:6px">Backup da mesa</h2>
    <p class="small" style="margin-top:0">Copie o texto para guardar uma cópia, ou cole um backup e clique em Restaurar.</p>
    <textarea id="bkText"></textarea>
    <div class="btnrow" style="margin-top:10px;justify-content:space-between">
      <div class="btnrow"><button class="b" id="bkCopy">Copiar</button><button class="b" id="bkRestore">Restaurar</button></div>
      <div class="btnrow"><button class="b dmg" id="bkReset">Resetar fichas</button><button class="b" id="bkClear">Limpar rolagens</button><button class="b" id="bkClose">Fechar</button></div>
    </div>
    <p class="small" id="bkMsg" style="margin-bottom:0"></p>
  </div>
</div>

function ls(k,v){try{if(v===undefined)return JSON.parse(localStorage.getItem(k));localStorage.setItem(k,JSON.stringify(v))}catch(e){return null}}
function ss(k,v){try{if(v===undefined)return sessionStorage.getItem(k);sessionStorage.setItem(k,v)}catch(e){return null}}
function hhmm(t){const x=new Date(t);return String(x.getHours()).padStart(2,"0")+":"+String(x.getMinutes()).padStart(2,"0")}
function pcState(c){return c.falhas>=3?"dead":c.hp<=0?(c.estavel?"stab":"down"):"ok"}
function statusLabel(st){return{ok:["Ativo","st-ok"],down:["Incapacitado — morrendo","st-down"],stab:["Incapacitado — estável","st-stab"],dead:["Morto","st-dead"]}[st]}
function penalties(c){return{all:(c.infec>=4?3:c.infec>=3?2:c.infec>=2?1:0)+(c.medo>=3?1:0),fis:c.feridas,atk:c.medo===2?1:0}}
function attrMod(c,k){const p=penalties(c);return Number(c[k])-p.all-(["forca","agil","prec"].includes(k)?p.fis:0)}
function outcome(total,dif,nat){
  if(nat===20)return["SUCESSO CRÍTICO","oc-ex"];if(nat===1)return["FALHA CRÍTICA","oc-f"];
  if(dif===null||dif===undefined||dif==="")return null;
  if(total>=dif+5)return["Excepcional","oc-ex"];if(total>=dif)return["Sucesso","oc-ok"];
  if(total>=dif-5)return["Com consequência","oc-cs"];return["Falha","oc-f"];
}
function weapons(c){
  return String(c.equip||"").split("\n").map(l=>l.trim()).filter(Boolean).map(l=>{
    const m=l.match(/\((\d*)D(\d+)\s*([+-]\s*\d+)?\)/i);if(!m)return null;
    const name=l.replace(/\(.*?\)/,"").trim();
    return{name,n:Number(m[1]||1),f:Number(m[2]),b:m[3]?Number(m[3].replace(/\s/g,"")):0,ranged:RANGED.test(name),fire:FIRE.test(name),usesAmmo:RANGED.test(name)};
  }).filter(Boolean);
}

function clean(o){return JSON.parse(JSON.stringify(o))}
function writer(path,body){
  let busy=false,again=false,timer=null;
  async function flush(){
    if(LOCAL()){saveLocal();return}
    if(!fdb||!(role==="mestre"&&unlocked))return;
    if(busy){again=true;return}
    busy=true;
    try{await fdb.ref(path).set({json:JSON.stringify(body()),by:clientId,at:Date.now()});setConn()}
    catch(e){toast("Não consegui salvar: "+(e&&e.code||"erro"))}
    busy=false;if(again){again=false;flush()}
  }
  return{save(){clearTimeout(timer);timer=setTimeout(flush,LOCAL()?50:500)},flush};
}
const W={pub:writer("publico",()=>PUB),priv:writer("mestre",()=>PRIV)};
function savePub(){W.pub.save()} function savePriv(){W.priv.save()}
function saveLog(){if(LOCAL())saveLocal()}
function editing(){const a=document.activeElement;return a&&(a.tagName==="TEXTAREA"||(a.tagName==="INPUT"&&(a.type==="text"||a.type==="number")))&&$("#view").contains(a)}
let queued=false;
function rerender(){if(editing()){queued=true;return}renderAll()}
document.addEventListener("focusout",()=>setTimeout(()=>{if(queued&&!editing()){queued=false;renderAll()}},60));

let connected=false;
function setConn(){
  const el=$("#conn");if(!el)return;
  if(!capsReady){el.className="conn";el.innerHTML="<i></i>conectando…";return}
  if(LOCAL()){el.className="conn warn";el.innerHTML=`<i></i>modo local (${CONFIG_OK()?"sem conexão":"Firebase não configurado"})`;return}
  const n=Object.values(ONLINE).filter(o=>o&&(o.pc||o.mestre)).length;
  el.className="conn "+(connected?"on":"warn");
  el.innerHTML=`<i></i>${connected?`na mesa · ${n} conectado${n===1?"":"s"}`:"reconectando…"}`;
}

let onlineRef=null;
function updateOnline(){
  if(!fdb)return;
  if(!onlineRef){onlineRef=fdb.ref("online/"+clientId);onlineRef.onDisconnect().remove()}
  const v={pc:role==="jogador"?myPc:null,mestre:role==="mestre"&&unlocked?true:null,at:Date.now()};
  onlineRef.set(clean(v)).catch(()=>{});
}
const pushPresence=updateOnline;

function initFirebase(){
  if(!CONFIG_OK()||!window.firebase){bootLocal();return}
  try{
    fb=firebase.initializeApp(FIREBASE_CONFIG);fdb=firebase.database();fauth=firebase.auth();
  }catch(e){bootLocal();return}
  capsReady=true;
  try{fauth.setPersistence(firebase.auth.Auth.Persistence.SESSION)}catch(e){}
  fdb.ref(".info/connected").on("value",s=>{connected=!!s.val();if(connected)updateOnline();setConn()});
  fdb.ref("online").on("value",s=>{ONLINE=s.val()||{};setConn();renderOnline();if(!role)renderView()});
  fdb.ref("publico").on("value",s=>{const x=s.val();if(x&&x.json&&x.by!==clientId){try{PUB=mergePub(JSON.parse(x.json))}catch(e){}rerender()}});
  const q=fdb.ref("rolagens").orderByChild("at").limitToLast(150);
  q.on("child_added",s=>{const r=sanitize(s.val()||{});r._k=s.key;if(!LOG.some(x=>x.id===r.id)){LOG.unshift(r);LOG.sort((a,b)=>b.at-a.at);seenNew.add(r.id)}ingestOne(r);renderFeeds()});
  q.on("child_removed",s=>{const v=s.val()||{};LOG=LOG.filter(x=>x.id!==v.id);renderFeeds()});
  fauth.onAuthStateChanged(u=>{
    const isM=!!(u&&u.email&&MASTER_EMAIL&&u.email.toLowerCase()===MASTER_EMAIL.toLowerCase());
    if(isM){
      fdb.ref("mestre").on("value",s=>{const x=s.val();if(x&&x.json){if(x.by!==clientId){try{PRIV=mergePriv(JSON.parse(x.json))}catch(e){}}}
        if(!unlocked)unlock();else rerender();
        LOG.forEach(ingestOne);
      },e=>toast("Sem acesso à área do mestre: confira as regras do Firebase."));
    }else if(unlocked){unlocked=false;role=null;renderAll()}
  });
  setConn();renderAll();
}
let booted=false;
function bootLocal(){
  if(booted)return;booted=true;capsReady=true;fdb=null;
  const a=ls("us-mesa-pub"),b=ls("us-mesa-priv"),c=ls("us-mesa-log");
  if(a)PUB=mergePub(a);if(b)PRIV=mergePriv(b);if(Array.isArray(c))LOG=c;
  setConn();renderAll();
}

/* ---------- rolls ---------- */
function newRoll(o){return Object.assign({id:clientId+"-"+(++rollSeq),at:Date.now()},o)}
function emitRoll(r){
  seenNew.add(r.id);
  if(r.secret){PRIV.secret.unshift(r);PRIV.secret=PRIV.secret.slice(0,60);savePriv();if(role==="mestre")applyEffects(r);renderFeeds();return}
  myRolls.unshift(r);myRolls=myRolls.slice(0,10);
  if(LOCAL()){LOG.unshift(r);LOG=LOG.slice(0,150);ingestOne(r);saveLocal();renderFeeds();return}
  if(fdb)fdb.ref("rolagens").push(clean(sanitize(r))).catch(e=>toast("Rolagem não enviada: "+(e&&e.code||"sem conexão")));
  renderFeeds();
}
function sanitize(r){const o={};["id","at","pc","who","label","dice","raw","mod","total","nat","kind","attr","pedido","ammo","fire","dif","secret","nome"].forEach(k=>{if(r[k]!==undefined&&r[k]!==null)o[k]=r[k]});
  if(!Array.isArray(o.raw))o.raw=o.raw&&typeof o.raw==="object"?Object.values(o.raw):[];o.raw=o.raw.slice(0,10).map(Number);o.total=Number(o.total)||0;o.mod=Number(o.mod)||0;o.label=String(o.label||"").slice(0,90);o.at=Number(o.at)||Date.now();o.id=String(o.id||Math.random());return o}
function ingestOne(r){
  if(!(role==="mestre"&&unlocked)&&!LOCAL())return;
  if(!PRIV.done)PRIV.done=[];
  if(PRIV.done.includes(r.id))return;
  PRIV.done.push(r.id);PRIV.done=PRIV.done.slice(-400);
  applyEffects(r);savePriv();
}
function applyEffects(r){
  let changed=false;
  if(r.kind==="iniciativa"){
    const nome=r.pc&&PCMAP[r.pc]?PCMAP[r.pc].nome:(r.nome||r.who||"?");
    if(PUB.ini&&PUB.ini.ativa){const key=r.pc?("pc:"+r.pc):("x:"+nome);
      PUB.ini.lista=(PUB.ini.lista||[]).filter(x=>x.key!==key).concat({key,nome,pc:r.pc||null,valor:r.total,agil:r.pc&&PUB.pcs[r.pc]?Number(PUB.pcs[r.pc].agil):0});
      sortIni();changed=true}
  }
  const c=PUB.pcs[r.pc];
  if(c){
    if(r.kind==="morte"&&c.hp<=0&&!c.estavel&&c.falhas<3){
      if(r.nat===20){c.hp=1;c.falhas=0}else if(r.nat===1)c.falhas=clamp(c.falhas+2,0,3);else if(r.total<10)c.falhas=clamp(c.falhas+1,0,3);changed=true}
    if(r.kind==="infec"&&c.infec>=1&&c.infec<5){const dif=11+c.infec;
      if(r.total<dif&&r.nat!==20)c.infec++;else if(c.infec===1&&(r.total>=dif+5||r.nat===20))c.infec=0;changed=true}
    if(r.kind==="ataque"&&r.ammo){c.mun=Math.max(0,c.mun-1);if(r.fire)PUB.ruido=clamp(PUB.ruido+1,0,5);changed=true}
  }
  if(changed){savePub();rerender()}
}
function sortIni(){
  if(!PUB.ini.comecou){PUB.ini.lista.sort((a,b)=>b.valor-a.valor||(b.agil||0)-(a.agil||0)||((b.pc?1:0)-(a.pc?1:0)));PUB.ini.turno=0;return}
  const cur=PUB.ini.lista[PUB.ini.turno];
  PUB.ini.lista.sort((a,b)=>b.valor-a.valor||(b.agil||0)-(a.agil||0)||((b.pc?1:0)-(a.pc?1:0)));
  if(cur){const i=PUB.ini.lista.findIndex(x=>x.key===cur.key);PUB.ini.turno=i<0?0:i}
}
function knownDif(r){
  if(r.dif!==undefined&&r.dif!==null)return r.dif;
  if(r.pedido&&role==="mestre"&&unlocked&&PRIV.difs[r.pedido]!==undefined)return PRIV.difs[r.pedido];
  if(r.pedido&&PUB.pedido&&PUB.pedido.id===r.pedido&&PUB.pedido.dif!=null)return PUB.pedido.dif;
  return null;
}
function allRolls(){
  const map=new Map();
  LOG.forEach(r=>map.set(r.id,r));
  myRolls.forEach(r=>{if(!map.has(r.id))map.set(r.id,r)});
  if(role==="mestre"&&unlocked)PRIV.secret.forEach(r=>map.set(r.id,r));
  return[...map.values()].sort((a,b)=>b.at-a.at);
}
function whoColor(r){return r.pc&&PCMAP[r.pc]?PCMAP[r.pc].cor:"#777"}
function whoName(r){return r.pc&&PCMAP[r.pc]?PCMAP[r.pc].nome:(r.who||"Mestre")}
function feedHTML(limit){
  const rs=allRolls().slice(0,limit);
  if(!rs.length)return`<div class="small">Nenhuma rolagem ainda.</div>`;
  return rs.map(r=>{
    const oc=r.kind==="morte"?(r.nat===20?["Volta com 1 PV","oc-ex"]:r.nat===1?["2 falhas","oc-f"]:r.total>=10?["Resiste","oc-ok"]:["1 falha","oc-f"]):
      (r.kind==="infec"||r.kind==="iniciativa")?null:r.dice==="D20"?outcome(r.total,knownDif(r),r.nat):null;
    const nat=r.dice==="D20"&&r.kind!=="iniciativa"?(r.nat===20?"crit":r.nat===1?"fail":""):"";
    const raw=(r.raw||[]).join(", ");
    return`<div class="fi ${r.secret?"secret":""} ${seenNew.has(r.id)?"new":""}"><span class="c" style="background:${whoColor(r)}"></span>
      <div><div class="w"><b>${esc(whoName(r))}</b> · ${esc(r.label)}${oc?`<span class="oc ${oc[1]}">${oc[0]}</span>`:""}${r.secret?` <span class="small">· secreta</span>`:""}</div>
      <div class="d">${hhmm(r.at)} · ${esc(r.dice)} [${esc(raw)}]${r.mod?(r.mod>0?" +":" ")+r.mod:""}${knownDif(r)!=null&&r.dice==="D20"&&(role==="mestre"||r.dif!=null)?` · DIF ${knownDif(r)}`:""}</div></div>
      <div class="tot ${nat}">${r.total}</div></div>`}).join("");
}
function renderFeeds(){
  document.querySelectorAll("[data-feed]").forEach(el=>{el.innerHTML=feedHTML(Number(el.dataset.feed)||30)});
  setTimeout(()=>seenNew.clear(),1300);
  if(role==="mestre"&&unlocked){const r=$("#respBox");if(r)r.innerHTML=respHTML()}
}

function ingest(){LOG.forEach(ingestOne)}

/* ---------- player actions ---------- */
function rollTest(k,extra){
  const c=PUB.pcs[myPc],p=PCMAP[myPc],m=attrMod(c,k)+(nextSpec?2:0)+nextBonus,r=d(20);
  const ped=PUB.pedido&&pedidoForMe()?PUB.pedido:null;
  const isPed=ped&&ped.attr===k;
  const parts=[`${ANAME[k]} ${c[k]}`];if(penalties(c).all||(["forca","agil","prec"].includes(k)&&c.feridas))parts.push("penalidades");if(nextSpec)parts.push("especialidade +2");if(nextBonus)parts.push(`bônus ${nextBonus>0?"+":""}${nextBonus}`);
  const roll=newRoll({pc:myPc,label:(extra&&extra.label)||`Teste de ${ANAME[k]}`,dice:"D20",raw:[r],mod:m,total:r+m,nat:r,kind:(extra&&extra.kind)||"teste",attr:k,pedido:isPed?ped.id:undefined,dif:isPed&&ped.dif!=null?ped.dif:undefined});
  showResult(roll,parts.join(" · "));
  nextSpec=false;nextBonus=0;emitRoll(roll);renderView();
}
function rollAttack(w){
  const c=PUB.pcs[myPc];const k=w.ranged?"prec":"forca";
  if(w.usesAmmo&&c.mun<=0){toast("Sem munição!");return}
  const pen=penalties(c);const m=attrMod(c,k)-pen.atk+(nextSpec?2:0)+nextBonus,r=d(20);
  const roll=newRoll({pc:myPc,label:`Ataque · ${w.name}`,dice:"D20",raw:[r],mod:m,total:r+m,nat:r,kind:"ataque",attr:k,ammo:w.usesAmmo?1:0,fire:w.fire?1:0});
  if(w.usesAmmo&&!LOCAL())c.mun=Math.max(0,c.mun-1); // optimistic; master confirms
  showResult(roll,`${ANAME[k]} ${c[k]}${pen.atk?" · abalado −1":""}${nextSpec?" · especialidade +2":""}${nextBonus?` · bônus ${nextBonus}`:""} — compare com a Defesa do alvo`);
  nextSpec=false;nextBonus=0;emitRoll(roll);renderView();
}
function rollDamage(w){
  const raw=[];for(let i=0;i<w.n;i++)raw.push(d(w.f));
  const tot=raw.reduce((a,b)=>a+b,0)+w.b;
  const roll=newRoll({pc:role==="jogador"?myPc:undefined,who:role==="mestre"?"Mestre":undefined,label:`Dano · ${w.name}`,dice:`${w.n}D${w.f}${w.b?(w.b>0?"+":"")+w.b:""}`,raw,mod:w.b,total:tot,kind:"dano"});
  showResult(roll,"dano");emitRoll(roll);
}
function rollFree(f,q){
  const raw=[];for(let i=0;i<q;i++)raw.push(d(f));const tot=raw.reduce((a,b)=>a+b,0);
  const roll=newRoll({pc:myPc,label:`${q}D${f}`,dice:`${q}D${f}`,raw,mod:0,total:tot,nat:f===20&&q===1?raw[0]:undefined,kind:"livre"});
  showResult(roll,q>1?raw.join(" + "):"");emitRoll(roll);
}
function rollDeath(){
  const r=d(20);const roll=newRoll({pc:myPc,label:"Teste de morte",dice:"D20",raw:[r],mod:0,total:r,nat:r,kind:"morte"});
  showResult(roll,r===20?"Natural 20 — volta com 1 PV!":r===1?"Natural 1 — 2 falhas":r>=10?"Resiste nesta rodada":"Marca 1 falha");emitRoll(roll);
}
function rollInfec(){
  const c=PUB.pcs[myPc],m=attrMod(c,"forca"),r=d(20),dif=11+c.infec;
  const roll=newRoll({pc:myPc,label:"Progressão da infecção",dice:"D20",raw:[r],mod:m,total:r+m,nat:r,kind:"infec",attr:"forca",dif});
  const t=r+m;showResult(roll,(t<dif&&r!==20)?"falhou — a infecção avança":(c.infec===1&&(t>=dif+5||r===20))?"excepcional — o corpo venceu":"resistiu — mantém o nível");emitRoll(roll);
}
function rollIni(){
  const c=PUB.pcs[myPc],m=Number(c.ini)-penalties(c).all+nextBonus,r=d(20);
  const roll=newRoll({pc:myPc,label:"Iniciativa",dice:"D20",raw:[r],mod:m,total:r+m,nat:r,kind:"iniciativa"});
  showResult(roll,"ordem dos turnos");nextBonus=0;emitRoll(roll);
}
function iniListHTML(master){
  const I=PUB.ini;if(!I||!I.ativa)return"";
  if(!I.lista.length)return`<div class="small">Aguardando as rolagens de iniciativa…</div>`;
  return`<div class="inilist">${I.lista.map((x,i)=>`<div class="ini-i ${i===I.turno?"cur":""}" style="--c:${x.pc&&PCMAP[x.pc]?PCMAP[x.pc].cor:"#777"}" ${master?`data-act="iniSet" data-i="${i}"`:""}>
    <span class="ini-v">${x.valor}</span><span class="ini-n">${esc(x.nome)}${x.pc&&x.pc===myPc&&!master?" (você)":""}</span>${i===I.turno?`<span class="ini-t">vez</span>`:""}
    ${master?`<button class="clr" data-act="iniDel" data-i="${i}" title="remover">✕</button>`:""}</div>`).join("")}</div>`;
}
function iniPlayerHTML(c,st){
  const I=PUB.ini;if(!I||!I.ativa)return"";
  const inList=I.lista.some(x=>x.pc===myPc);
  const rolled=myRolls.some(r=>r.kind==="iniciativa"&&r.at>=(I.inicio||0));
  const cur=I.lista[I.turno];const myTurn=cur&&cur.pc===myPc;
  const m=Number(c.ini)-penalties(c).all;
  return`<div class="card ${myTurn?"pedido":""}" style="--c:${PCMAP[myPc].cor}">
    <div class="t" style="font-size:11px;text-transform:uppercase;letter-spacing:.1em;color:#ff8a80">Combate · rodada ${I.rodada}</div>
    ${myTurn?`<div class="q" style="font-family:Bebas Neue;font-size:34px;margin:2px 0 6px">É a sua vez!</div>`:""}
    ${!inList&&st!=="dead"?`<button class="big" style="margin:8px 0 12px" data-act="iniRoll" ${rolled?"disabled":""}>${rolled?"Iniciativa enviada ✓":"Rolar iniciativa"}<small>${rolled?"aguardando o mestre organizar a ordem":`D20 ${m>=0?"+":"−"} ${Math.abs(m)}`}</small></button>`:""}
    <h3 style="font-size:18px;margin:6px 0">Ordem dos turnos</h3>${iniListHTML(false)}</div>`;
}
function iniMasterHTML(){
  const I=PUB.ini;
  if(!I||!I.ativa)return`<div class="card"><h3>Iniciativa</h3><p class="small" style="margin-top:0">Ao iniciar, os jogadores recebem o botão “Rolar iniciativa” e os inimigos em cena rolam automaticamente.</p><button class="b pri" data-act="iniStart">Iniciar combate</button></div>`;
  const pend=PCS.filter(p=>!I.lista.some(x=>x.pc===p.id)&&pcState(PUB.pcs[p.id])!=="dead");
  return`<div class="card"><h3>Iniciativa · rodada ${I.rodada}</h3>${!I.comecou?`<div class="small" style="margin:-4px 0 8px">Esperando as rolagens. A ordem se reorganiza sozinha. Clique em “Próximo turno” quando o primeiro terminar de agir.</div>`:""}${iniListHTML(true)}
    <div class="btnrow" style="margin-top:10px"><button class="b" data-act="iniPrev">◀</button><button class="b pri" data-act="iniNext">Próximo turno ▶</button><button class="b" data-act="iniEnemies">Rolar inimigos em cena</button><button class="b dmg" data-act="iniEnd">Encerrar combate</button></div>
    <div class="row"><input type="text" id="iniNome" placeholder="Outro participante" style="flex:1;padding:5px 8px"><span class="small">mod</span><input type="number" id="iniMod" value="2"><button class="b" data-act="iniAdd">Rolar e incluir</button></div>
    ${pend.length?`<div class="small" style="margin-top:8px">Ainda não rolaram: ${pend.map(p=>p.nome).join(", ")}</div>`:""}</div>`;
}
function pedidoForMe(){const p=PUB.pedido;if(!p)return false;return p.alvos==="todos"||(Array.isArray(p.alvos)&&p.alvos.includes(myPc))}
function answeredPedido(){const p=PUB.pedido;return p&&allRolls().some(r=>r.pedido===p.id&&r.pc===myPc)}
function showResult(r,why){lastResult={r,why};}

/* ---------- render: player ---------- */
function renderPlayer(){
  const p=PCMAP[myPc],c=PUB.pcs[myPc],st=pcState(c),pen=penalties(c);
  const tab=ss("us-ptab")||"jogar";

  const penTxt=[];if(pen.all)penTxt.push(`−${pen.all} em todos os testes`);if(pen.fis)penTxt.push(`−${pen.fis} em Força/Agilidade/Precisão`);if(pen.atk)penTxt.push("−1 em ataques");

    <td><div class="btnrow"><input type="number" id="eamt-${i}" placeholder="0" style="width:46px"><button class="b dmg" data-act="edano" data-i="${i}">Dano</button><button class="b dmg" data-act="ehp" data-i="${i}" data-v="-1">−1</button><button class="b heal" data-act="ehp" data-i="${i}" data-v="1">+1</button><button class="b" data-act="eatk" data-i="${i}">Atacar</button><button class="b" data-act="edmg" data-i="${i}">Dano ${esc(e.dano.split("/")[0])}</button><button class="b" data-act="edel" data-i="${i}">✕</button></div></td><td class="small">${esc(e.nota||"")}</td></tr>`).join("");
  return`<div class="sec-title" style="margin-top:0"><h2>Combate</h2><span class="small">Ataque e dano dos inimigos usam a opção “secretas” da caixa de dados.</span></div>
  <div class="card"><div class="btnrow" style="margin-bottom:12px">${Object.entries(ENEMIES).map(([k,e])=>`<button class="b" data-act="eadd" data-k="${k}">+ ${e.nome}</button>`).join("")}</div>
  ${PRIV.enemies.length?`<div class="tablewrap"><table><thead><tr><th>Inimigo</th><th>Atq</th><th>Def</th><th>Dano</th><th>PV</th><th></th><th>Nota</th></tr></thead><tbody>${rows}</tbody></table></div>
  <div class="btnrow" style="margin-top:10px"><button class="b" data-act="eclean">Remover derrotados</button><button class="b" data-act="eclear">Limpar tudo</button></div>`:`<div class="small">Nenhum inimigo em cena.</div>`}</div>
  <div class="sec-title"><h2>NPCs</h2><button class="b" data-act="nadd">+ Novo NPC</button></div>${PRIV.npcs.length?`<div class="npcgrid">${cards}</div>`:`<div class="card small">Nenhum NPC carregado.</div>`}`;
}
const RULES=`<div class="rules">
<div class="toc">
<a href="#r-teste">Testes</a><a href="#r-rodada">Rodada e iniciativa</a><a href="#r-ataque">Ataque e Defesa</a><a href="#r-reacoes">Esquiva e proteção</a><a href="#r-dano">Dano e morte</a><a href="#r-cura">Cura</a><a href="#r-municao">Munição e Ruído</a><a href="#r-infec">Infecção</a><a href="#r-medo">Medo</a><a href="#r-inimigos">Inimigos</a><a href="#r-evo">Evolução</a><a href="#r-mestre">Mestre</a>
</div>

<section id="r-teste">
<h2>1. Testes</h2>
<div class="formula">D20 + atributo + bônus − penalidades ≥ DIF</div>
<ul>
<li><b>Especialidade</b> relevante: +2. <b>Boa interpretação</b>: +1 ou +2.</li>
<li>Não ter a especialidade nunca impede de tentar.</li>
</ul>
<table><thead><tr><th>Dificuldade</th><th>DIF</th></tr></thead><tbody>
<tr><td>Muito fácil</td><td>5</td></tr><tr><td>Fácil</td><td>8</td></tr><tr><td>Normal</td><td>11</td></tr><tr><td>Difícil</td><td>14</td></tr><tr><td>Muito difícil</td><td>17</td></tr><tr><td>Extremamente difícil</td><td>20</td></tr><tr><td>Quase impossível</td><td>25</td></tr></tbody></table>
<h4>Resultado (vale para qualquer DIF) <span class="new">FECHADO</span></h4>
<table><tbody>
<tr><td>DIF + 5 ou mais</td><td>Sucesso excepcional</td></tr>
<tr><td>DIF até DIF + 4</td><td>Sucesso</td></tr>
<tr><td>DIF − 5 até DIF − 1</td><td>Sucesso com consequência (custo, tempo, barulho)</td></tr>
<tr><td>Abaixo de DIF − 5</td><td>Falha</td></tr>
<tr><td>Natural 20 / Natural 1</td><td>Crítico / Falha crítica, independente do total</td></tr>
</tbody></table>
<p class="small">Exemplo com DIF 15: 20+ excepcional · 15–19 sucesso · 10–14 com consequência · 9− falha.</p>
</section>

<section id="r-rodada">
<h2>2. Rodada e iniciativa <span class="new">NOVO</span></h2>
<div class="formula">Iniciativa = D20 + valor de Iniciativa</div>
<table><thead><tr><th>Personagem</th><th>Iniciativa</th></tr></thead><tbody>
<tr><td>Helder</td><td>+2</td></tr><tr><td>Marcos</td><td>+4 (treino tático)</td></tr><tr><td>Rafael</td><td>+3</td></tr>
<tr><td>Júlio</td><td>+4</td></tr><tr><td>André</td><td>+3</td></tr><tr><td>Diego</td><td>+6 (vive em alerta)</td></tr>
</tbody></table>
<p class="small">Valor base = Agilidade, com +1 para Marcos e Diego. Penalidades de Infecção e Medo também descontam da iniciativa.</p>
<ul>
<li><b>Ao começar um combate</b>, todos rolam iniciativa, e os inimigos também. A ordem vai do maior resultado para o menor.</li>
<li><b>Empate:</b> quem tem maior Agilidade age primeiro. Se continuar empatado, o personagem do jogador vai antes.</li>
<li><b>Emboscada:</b> quem surpreende ganha uma rodada livre antes de todos rolarem.</li>
<li><b>No seu turno:</b> 1 movimento + 1 ação (atacar, recarregar, abrir uma porta, usar um item, estabilizar alguém…). Pode trocar a ação por um segundo movimento.</li>
<li>Falar é livre, desde que seja curto. Quem chega no meio do combate rola iniciativa e entra na ordem.</li>
</ul>
<table><thead><tr><th>Inimigo</th><th>Iniciativa</th></tr></thead><tbody>
<tr><td>Infectado comum</td><td>+0</td></tr><tr><td>Corredor</td><td>+4</td></tr><tr><td>Estalador</td><td>+2</td></tr><tr><td>Eco</td><td>+5</td></tr><tr><td>Saqueador</td><td>+2</td></tr><tr><td>Militar</td><td>+3</td></tr>
</tbody></table>
</section>

<section id="r-ataque">
<h2>3. Ataque e Defesa <span class="new">NOVO</span></h2>
<div class="formula">Defesa = 10 + Agilidade</div>
<ul>
<li><b>Corpo a corpo:</b> D20 + Força ≥ Defesa do alvo.</li>
<li><b>À distância</b> (armas de fogo, arco, arremesso): D20 + Precisão ≥ Defesa do alvo. A especialidade <i>Armas de fogo</i> dá +2.</li>
<li><b>Inimigos</b> rolam o ataque deles contra a Defesa do personagem.</li>
<li><b>Mirar na cabeça:</b> −4 no ataque; se acertar, o dano dobra. O colete não protege a cabeça.</li>
<li><b>Cobertura do ambiente:</b> parcial +2 na Defesa, boa +4. Atrás de uma parede sólida, não pode ser alvo.</li>
<li><b>Postura defensiva:</b> gaste a ação para ganhar +3 na Defesa até o seu próximo turno.</li>
<li><b>Crítico (natural 20):</b> dano máximo do dado + role o dado de novo e some.</li>
<li><b>Falha crítica (natural 1):</b> a arma emperra (perde a próxima ação), a flecha quebra, ou algo faz barulho (+1 Ruído). O mestre escolhe.</li>
<li>Arma de fogo sem munição vira porrete: 1D4.</li>
</ul>
</section>

<section id="r-reacoes">
<h2>4. Esquiva e proteção <span class="new">NOVO</span></h2>
<h4>Esquiva (reação)</h4>
<p>Uma vez por rodada, quando for acertado por um ataque que consegue ver: role <b>D20 + Agilidade</b>. Se igualar ou superar o resultado do ataque, evita o golpe. O custo é perder o movimento no próximo turno. Não funciona contra tiros, a não ser que já esteja correndo para uma cobertura (o mestre decide).</p>
<h4>Colete (Redução de Dano)</h4>
<p>Reduz 2 de todo dano físico recebido, com mínimo de 1. O botão “Dano” da ficha já aplica isso.</p>
<h4>Cobertura — habilidade do Marcos</h4>
<p>Uma vez por rodada, quando um aliado ao alcance for atacado, Marcos escolhe uma opção: dar <b>+3 na Defesa</b> do aliado contra esse ataque, ou <b>receber o ataque no lugar dele</b> (usando a Defesa e o colete do Marcos). Não gasta a ação dele.</p>
</section>

<section id="r-dano">
<h2>5. Dano, incapacitação e morte <span class="new">FECHADO</span></h2>
<ul>
<li><b>0 PV:</b> incapacitado. No chão, só fala baixo ou rasteja.</li>
<li><b>Teste de morte:</b> no início de cada turno dele, D20 sem modificador. 10+ resiste nesta rodada. 9 ou menos marca 1 falha. Natural 1 marca 2 falhas. Natural 20 volta com 1 PV.</li>
<li><b>3 falhas:</b> morte.</li>
<li><b>Dano enquanto incapacitado:</b> +1 falha. Um golpe crítico ou uma execução deliberada mata na hora.</li>
<li><b>Estabilizar:</b> gasta a ação. Teste de Intelecto DIF 11 com kit ou DIF 14 sem kit (+2 com Medicina ou Primeiros socorros). Gasta 1 uso do kit. <b>André</b> estabiliza sem teste se tiver o kit.</li>
<li><b>Estável:</b> para de rolar testes de morte e acorda com 1 PV após 1 hora de descanso. Ganha 1 Ferimento Grave.</li>
</ul>
<h4>Ferimento Grave <span class="new">NOVO</span></h4>
<p>Ganho ao ser estabilizado depois de cair a 0, ou ao sofrer 10 ou mais de dano num único golpe. Cada um dá <b>−1 em testes de Força, Agilidade e Precisão</b> (máximo 3). Para remover um: 3 dias de descanso e um teste de Intelecto DIF 14 com kit, feito por quem cuida dele (um ferimento por vez).</p>
</section>

<section id="r-cura">
<h2>6. Cura <span class="new">NOVO</span></h2>
<ul>
<li><b>Kit médico (3 usos):</b> ação + teste de Intelecto DIF 11. Sucesso cura 1D6, sucesso excepcional cura 1D6 + 3. Cada personagem pode ser tratado só 1 vez por cena.</li>
<li><b>Descanso curto</b> (1 hora em lugar seguro, com água e comida): +1D4 PV.</li>
<li><b>Noite de sono segura:</b> +1D6 + Vontade em PV, e o Medo zera.</li>
<li>Kits podem ser reabastecidos com suprimentos de farmácia ou hospital (o mestre define quantos usos).</li>
</ul>
</section>

<section id="r-municao">
<h2>7. Munição e Ruído <span class="new">NOVO</span></h2>
<ul>
<li>Munição é contada: 1 bala ou flecha por ataque. A ficha tem um contador.</li>
<li><b>Flechas:</b> depois do combate, recupera metade das que disparou (arredondando para baixo).</li>
<li>Recarregar é livre. A escassez já é a pressão.</li>
</ul>
<h4>Ruído (barra no topo da página)</h4>
<table><tbody>
<tr><td>+1</td><td>Cada tiro (o contador de balas já soma), vidro quebrando, porta arrombada, falha crítica</td></tr>
<tr><td>+2</td><td>Grito, alarme, explosão</td></tr>
<tr><td><b>3</b></td><td>Infectados próximos se aproximam: entram 1D4 infectados comuns</td></tr>
<tr><td><b>5</b></td><td><b>Horda.</b> Lutar é suicídio, a saída é fugir ou se esconder</td></tr>
<tr><td>−1</td><td>A cada 10 minutos de silêncio</td></tr>
</tbody></table>
<p class="small">Estaladores se guiam pelo som: com Ruído 3 ou mais, eles têm +2 no ataque.</p>
</section>

<section id="r-infec">
<h2>8. Infecção <span class="new">NOVO</span></h2>
<p><b>Exposição:</b> quando um infectado causa dano com mordida ou arranhão (depois do colete), o personagem testa <b>Força DIF 11</b> (DIF 14 contra Estalador ou Eco). Se falhar, a Infecção sobe para 1.</p>
<table><thead><tr><th>Nível</th><th>Estado</th><th>Efeito</th></tr></thead><tbody>
<tr><td>0</td><td>Limpo</td><td>—</td></tr>
<tr><td>1</td><td>Exposto</td><td>Sem sintomas visíveis</td></tr>
<tr><td>2</td><td>Febre</td><td>−1 em todos os testes</td></tr>
<tr><td>3</td><td>Confusão</td><td>−2 em todos os testes; em cena tensa, teste de Vontade DIF 11 ou age por impulso</td></tr>
<tr><td>4</td><td>Convulsões</td><td>−3 em todos os testes; não consegue correr; crises a critério do mestre</td></tr>
<tr><td>5</td><td>Colonização</td><td>O personagem é perdido… a não ser que a campanha abra o caminho raro da simbiose</td></tr>
</tbody></table>
<ul>
<li><b>Progressão:</b> a cada 8 horas de jogo (ou ao fim de cada descanso longo), quem tem Infecção 1 ou mais testa <b>Força DIF 11 + nível</b>. Se falhar, sobe 1 nível. Se passar, fica onde está. Há um botão na ficha.</li>
<li><b>Única saída conhecida:</b> com Infecção 1, um sucesso excepcional no teste de progressão faz o corpo vencer e o nível volta a 0. Ninguém sabe por quê.</li>
<li><b>Medicamentos</b> (antibióticos, antivirais) mais um teste de Intelecto DIF 14 de quem trata dão +3 no próximo teste de progressão. Não existe cura conhecida.</li>
</ul>
</section>

<section id="r-medo">
<h2>9. Medo <span class="new">FECHADO</span></h2>
<p>Teste de <b>Vontade</b>: DIF 11 para algo assustador, <b>DIF 14 para horror cósmico</b> (algo que não deveria existir, um infectado que fala), DIF 17 para o impossível. Se falhar, +1 Medo. Falha crítica dá +2.</p>
<table><thead><tr><th>Medo</th><th>Efeito</th></tr></thead><tbody>
<tr><td>1</td><td>Nervoso: apenas interpretação</td></tr>
<tr><td>2</td><td>Abalado: −1 em ataques</td></tr>
<tr><td>3</td><td>Em pânico: −1 em todos os testes; no próximo turno o jogador escolhe uma reação (fugir, congelar ou agir por impulso)</td></tr>
<tr><td>4</td><td><b>Ruptura:</b> o jogador escolhe um <b>Trauma</b> permanente (fobia, mania, pesadelos), que o mestre pode ativar 1 vez por sessão. Depois o Medo volta a 2</td></tr>
</tbody></table>
<p><b>Recuperação:</b> −1 por uma cena de apoio interpretada (uma conversa com o grupo, um momento de calma). Zera com uma noite segura. O jogador nunca perde o controle do personagem: ele escolhe como o medo aparece.</p>
</section>

<section id="r-inimigos">
<h2>10. Inimigos <span class="new">FECHADO</span></h2>
<div class="tablewrap"><table><thead><tr><th>Inimigo</th><th>Ataque</th><th>Defesa</th><th>PV</th><th>Dano</th><th>Traço</th></tr></thead><tbody>
<tr><td>Infectado comum</td><td>+3</td><td>10</td><td>8</td><td>1D6</td><td>Lento: só um movimento curto por turno</td></tr>
<tr><td>Corredor</td><td>+4</td><td>12</td><td>10</td><td>1D8</td><td>Rápido: alcança quem foge a pé</td></tr>
<tr><td>Estalador</td><td>+5</td><td>13</td><td>14</td><td>1D8+2</td><td>Cego: guia-se pelo som. Furtividade +2 contra ele, mas com Ruído 3+ ele ganha +2 no ataque</td></tr>
<tr><td>Eco</td><td>+6</td><td>14</td><td>18</td><td>1D10</td><td>Imita vozes; observa antes de atacar; recua quando perde metade dos PV</td></tr>
<tr><td>Saqueador</td><td>+3</td><td>12</td><td>14</td><td>pela arma</td><td>Humano: pode negociar, render-se ou fugir</td></tr>
<tr><td>Militar</td><td>+5</td><td>14</td><td>18</td><td>1D10</td><td>Colete RD 2; age em equipe</td></tr>
</tbody></table></div>
<p class="small">Infectados morrem com PV 0. Ataques à cabeça (−4, dano dobrado) são a forma eficiente de derrubá-los.</p>
</section>

<section id="r-evo">
<h2>11. Evolução <span class="new">NOVO</span></h2>
<p>No fim de cada sessão, cada personagem ganha 1 ponto por item cumprido:</p>
<ul><li>Participou da sessão.</li><li>Descobriu uma pista importante.</li><li>Agiu de acordo com o próprio segredo, ou o enfrentou.</li><li>Sobreviveu a algo terrível (critério do mestre).</li></ul>
<table><thead><tr><th>Custo</th><th>Avanço</th></tr></thead><tbody>
<tr><td>3 pontos</td><td>+2 PV máximos, ou uma nova especialidade</td></tr>
<tr><td>5 pontos</td><td>+1 em um atributo (máximo 6)</td></tr>
<tr><td>6 pontos</td><td>Nova habilidade especial, criada junto com o mestre</td></tr>
</tbody></table>
</section>

<section id="r-mestre">
<h2>12. Filosofia do mestre</h2>
<ul>
<li>Não peça testes desnecessários. Pistas importantes nunca dependem de uma única rolagem: uma falha atrasa a descoberta ou cobra um preço, mas não bloqueia a história.</li>
<li>Não limite ações por falta de especialidade. Recompense criatividade.</li>
<li>Consequências são reais. Nem todo encontro é combate.</li>
<li>Nunca decida falas ou reações dos personagens dos jogadores.</li>
<li>Diego não morre fora de cena e sua ausência nunca trava a história.</li>
<li>Não explique o inexplicável.</li>
</ul>
</section>
</div>
`;

/* ---------- main render ---------- */
function renderView(){
  const v=$("#view");
  if(role==="mestre"&&unlocked){
    $("#tray").classList.remove("hidden");
    const p=PCMAP[PRIV.tab];
    v.innerHTML=p?renderPC(p):PRIV.tab==="npcs"?renderNPCs():PRIV.tab==="regras"?RULES:renderMesa();
  }else{
    $("#tray").classList.add("hidden");
    v.innerHTML=role==="jogador"&&myPc?renderPlayer():renderLanding();
  }
}
function renderAll(){renderMeta();renderTabs();renderView()}

/* ---------- master helpers ---------- */
function setHp(c,v){const b=c.hp;c.hp=clamp(v,0,c.hpMax);if(c.hp>0){c.falhas=0;c.estavel=false}if(b>0&&c.hp<=0){c.estavel=false;toast("Incapacitado!")}}
function masterRoll(label,n,f,bonus,extra){
  const raw=[];for(let i=0;i<n;i++)raw.push(d(f));const mod=bonus||0;const tot=raw.reduce((a,b)=>a+b,0)+mod;
  const secret=$("#mSecret").checked;
  const r=newRoll(Object.assign({who:"Mestre",label,dice:n===1?`D${f}`:`${n}D${f}`,raw,mod,total:tot,nat:f===20&&n===1?raw[0]:undefined,kind:"mestre",secret},extra||{}));
  const res=$("#mRes");res.textContent=tot;res.className="res"+(r.nat===20?" crit":r.nat===1?" fail":"");
  const dif=$("#mDif").value===""?null:Number($("#mDif").value);const oc=f===20&&n===1?outcome(tot,dif,r.nat):null;
  $("#mWhy").innerHTML=`${esc(label)} · ${r.dice} [${raw.join(", ")}]${mod?` ${mod>0?"+":"−"} ${Math.abs(mod)}`:""}${oc?` · <b class="${oc[1]}">${oc[0]}</b>`:""}${secret?" · secreta":" · visível"}`;
  $("#tray").classList.remove("min");emitRoll(r);
}
async function sha(t){try{const b=await crypto.subtle.digest("SHA-256",new TextEncoder().encode("ultimo-sinal:"+t));return[...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,"0")).join("")}catch(e){let h=0;for(const ch of t)h=(h*31+ch.charCodeAt(0))|0;return"x"+h}}
let pinMode="enter";
function openPin(){
  if(!capsReady){toast("Conectando… tente de novo em instantes.");return}
  let has=true;
  if(LOCAL()){has=!!ls("us-pin");pinMode=has?"enter":"create"}else pinMode="enter";
  $("#pinTitle").textContent=has?"Área do Mestre":"Criar senha do mestre (modo local)";
  $("#pinMsg").textContent=LOCAL()?(has?"Digite sua senha numérica.":"Modo local: escolha uma senha de 6 a 12 números."):"Digite a senha numérica do mestre.";
  $("#pinIn2").classList.toggle("hidden",has);$("#pinIn").value="";$("#pinIn2").value="";$("#pinErr").textContent="";
  $("#pinOk").textContent=has?"Entrar":"Criar";$("#pinModal").classList.add("on");setTimeout(()=>$("#pinIn").focus(),50);
}
async function pinSubmit(){
  const a=$("#pinIn").value.trim();
  if(!/^\d{6,12}$/.test(a)){$("#pinErr").textContent="Use de 6 a 12 números.";return}
  if(LOCAL()){
    if(pinMode==="create"){if(a!==$("#pinIn2").value.trim()){$("#pinErr").textContent="As senhas não conferem.";return}ls("us-pin",await sha(a));unlock();return}
    if(await sha(a)===ls("us-pin"))unlock();else $("#pinErr").textContent="Senha incorreta.";return}
  $("#pinOk").disabled=true;$("#pinErr").textContent="";
  try{await fauth.signInWithEmailAndPassword(MASTER_EMAIL,a);$("#pinModal").classList.remove("on")}
  catch(e){const c=e&&e.code||"";$("#pinErr").textContent=/wrong-password|invalid-credential|invalid-login/.test(c)?"Senha incorreta.":/user-not-found/.test(c)?"Conta do mestre não encontrada — confira o MASTER_EMAIL.":/too-many/.test(c)?"Muitas tentativas. Espere um pouco.":"Erro ao entrar ("+c+")."}
  $("#pinOk").disabled=false;
}
function iniRollEnemies(){
  PRIV.enemies.filter(en=>en.hp>0).forEach(en=>{const key="e:"+en.nome;if(PUB.ini.lista.some(x=>x.key===key))return;
    const m=Number(en.ini??(ENEMIES[en.k]&&ENEMIES[en.k].ini)??0);PUB.ini.lista.push({key,nome:en.nome,pc:null,valor:d(20)+m,agil:0})});
  sortIni();
}
function unlock(){unlocked=true;role="mestre";$("#pinModal").classList.remove("on");updateOnline();ingest();renderAll()}
$("#pinOk").onclick=pinSubmit;$("#pinCancel").onclick=()=>$("#pinModal").classList.remove("on");
["#pinIn","#pinIn2"].forEach(s=>$(s).addEventListener("keydown",e=>{if(e.key==="Enter")pinSubmit()}));
$("#trayHd").onclick=()=>{const t=$("#tray");t.classList.toggle("min");$("#trayTog").textContent=t.classList.contains("min")?"abrir":"recolher"};
document.querySelectorAll("[data-mdie]").forEach(b=>b.onclick=()=>{const f=Number(b.dataset.mdie);masterRoll(`D${f}`,1,f,Number($("#mMod").value)||0)});

/* ---------- events ---------- */
document.addEventListener("click",e=>{
  const t=e.target.closest("[data-act],[data-pick],[data-tab],[data-ptab],[data-pd]");if(!t)return;
  if(t.dataset.pick){myPc=t.dataset.pick;role="jogador";lastResult=null;updateOnline();renderAll();window.scrollTo({top:0});return}
  if(t.dataset.ptab){ss("us-ptab",t.dataset.ptab);renderTabs();renderView();return}
  if(t.dataset.tab){PRIV.tab=t.dataset.tab;savePriv();renderTabs();renderView();window.scrollTo({top:0});return}
  if(t.dataset.pd){const k=t.dataset.pd,v=t.dataset.v;
    if(k==="attr")pd.attr=v;
    if(k==="alvo"){if(v==="todos")pd.alvos="todos";else{let a=Array.isArray(pd.alvos)?pd.alvos.slice():[];a=a.includes(v)?a.filter(x=>x!==v):a.concat(v);pd.alvos=a.length?a:"todos"}}
    pd.texto=$("#pdTxt")?$("#pdTxt").value:pd.texto;renderView();return}
  const a=t.dataset.act,id=t.dataset.id,v=Number(t.dataset.v);
  const c=id&&PUB.pcs[id]?PUB.pcs[id]:null;
  const P=role==="jogador"&&myPc?PUB.pcs[myPc]:null;
  switch(a){
    /* common */
    case"trocar":role=null;myPc=null;lastResult=null;updateOnline();renderAll();return;
    case"iniRoll":rollIni();renderView();window.scrollTo({top:0,behavior:"smooth"});return;
    case"abrirMestre":openPin();return;
    case"sairMestre":unlocked=false;role=null;if(fauth)fauth.signOut().catch(()=>{});if(fdb)fdb.ref("mestre").off();updateOnline();renderAll();return;
    case"backup":$("#bkText").value=JSON.stringify({pub:PUB,priv:Object.assign({},PRIV,{pinHash:undefined})});$("#bkMsg").textContent="";$("#bkModal").classList.add("on");return;
    /* player */
    case"test":rollTest(t.dataset.attr);window.scrollTo({top:0,behavior:"smooth"});return;
    case"pedRoll":rollTest(PUB.pedido.attr);return;
    case"deathRoll":rollDeath();renderView();return;
    case"infRoll":rollInfec();renderView();return;
    case"spec":nextSpec=!nextSpec;renderView();return;
    case"bonus":nextBonus=clamp(nextBonus+v,-5,5);renderView();return;
    case"qty":freeQty=clamp(freeQty+v,1,10);renderView();return;
    case"free":rollFree(Number(t.dataset.f),freeQty);renderView();window.scrollTo({top:0,behavior:"smooth"});return;
    case"atk":rollAttack(weapons(P)[t.dataset.w]);window.scrollTo({top:0,behavior:"smooth"});return;
    case"dmg":rollDamage(weapons(P)[t.dataset.w]);renderView();window.scrollTo({top:0,behavior:"smooth"});return;
  }
  if(!(role==="mestre"&&unlocked))return;
  switch(a){
    case"ruido":PUB.ruido=v;if(v===3)toast("Ruído 3: infectados se aproximam (1D4 comuns).");if(v===5)toast("Ruído 5: HORDA.");savePub();renderMeta();return;
    case"pdSend":{const dif=$("#pdDif").value===""?null:Number($("#pdDif").value);const show=$("#pdShow").checked;const txt=$("#pdTxt").value.trim();
      pd.dif=dif===null?"":dif;pd.show=show;pd.texto=txt;
      const pid="p"+Date.now().toString(36);PUB.pedido={id:pid,attr:pd.attr,alvos:pd.alvos,dif:show?dif:null,texto:txt,at:Date.now()};
      if(dif!==null)PRIV.difs[pid]=dif;savePub();savePriv();toast("Pedido enviado.");renderView();return}
    case"pdCancel":PUB.pedido=null;savePub();renderView();return;
    case"iniStart":{PUB.ini={ativa:true,rodada:1,turno:0,lista:[],inicio:Date.now(),comecou:false};iniRollEnemies();savePub();renderView();toast("Combate iniciado: jogadores, rolem iniciativa!");return}
    case"iniEnemies":iniRollEnemies();savePub();renderView();return;
    case"iniNext":{const I=PUB.ini;if(!I.lista.length)return;if(!I.comecou){I.comecou=true;}I.turno++;if(I.turno>=I.lista.length){I.turno=0;I.rodada++;toast("Rodada "+I.rodada)}savePub();renderView();return}
    case"iniPrev":{const I=PUB.ini;if(!I.lista.length)return;I.turno--;if(I.turno<0){if(I.rodada>1){I.rodada--;I.turno=I.lista.length-1}else I.turno=0}savePub();renderView();return}
    case"iniSet":{if(e.target.closest("[data-act=iniDel]"))return;PUB.ini.turno=Number(t.dataset.i);PUB.ini.comecou=true;savePub();renderView();return}
    case"iniDel":{e.stopPropagation();const I=PUB.ini,i=Number(t.dataset.i);I.lista.splice(i,1);if(I.turno>=I.lista.length)I.turno=0;else if(i<I.turno)I.turno--;savePub();renderView();return}
    case"iniAdd":{const nome=($("#iniNome").value||"").trim()||"Participante";const m=Number($("#iniMod").value)||0;const r=d(20);
      PUB.ini.lista.push({key:"x:"+nome+":"+Date.now(),nome,pc:null,valor:r+m,agil:0});sortIni();savePub();renderView();toast(`${nome}: ${r}+${m} = ${r+m}`);return}
    case"iniEnd":PUB.ini={ativa:false,rodada:1,turno:0,lista:[],inicio:0};savePub();renderView();return;
    case"hp":setHp(c,c.hp+v);break;
    case"dano":{const n=Number($("#amt-"+id).value)||0;if(!n)return;
      if(c.hp<=0){c.falhas=clamp(c.falhas+1,0,3);toast("Dano em incapacitado: +1 falha")}
      else{const dd=Math.max(1,n-Number(c.rd||0));setHp(c,c.hp-dd);if(dd>=10&&c.feridas<3){c.feridas++;toast("10+ de dano num golpe: Ferimento Grave")}else if(c.rd)toast(`Colete absorveu ${n-dd}`)}break}
    case"cura":{const n=Number($("#amt-"+id).value)||0;if(!n)return;setHp(c,c.hp+n);break}
    case"medo":c.medo=v;if(v===4)toast("Ruptura: anote um Trauma; o Medo volta a 2.");break;
    case"infec":c.infec=v;break;
    case"feridas":c.feridas=v;break;
    case"falhas":c.falhas=v;if(v>=3)toast("3 falhas: o personagem morreu.");break;
    case"estavel":c.estavel=!c.estavel;if(c.estavel&&c.feridas<3)c.feridas++;break;
    case"mun":c.mun=Math.max(0,c.mun+v);break;
    case"kit":c.kit=Math.max(0,c.kit+v);break;
    case"evo":c.evo=Math.max(0,c.evo+v);break;
    case"nhp":{const n=PRIV.npcs[t.dataset.i];n.hp=clamp(n.hp+v,0,n.hpMax);savePriv();renderView();return}
    case"nsethp":{const n=PRIV.npcs[t.dataset.i];n.hp=10;n.hpMax=10;savePriv();renderView();return}
    case"nadd":PRIV.npcs.push({id:"n"+Date.now().toString(36),nome:"Novo NPC",papel:"função",desc:"",hp:10,hpMax:10,notas:""});savePriv();renderView();return;
    case"ndel":{const i=Number(t.dataset.i);if(t.dataset.arm!=="1"){t.dataset.arm="1";t.textContent="Confirmar?";setTimeout(()=>{t.dataset.arm="";t.textContent="Remover"},2500);return}PRIV.npcs.splice(i,1);savePriv();renderView();return}
    case"eadd":{const k=t.dataset.k,tp=ENEMIES[k],cnt=PRIV.enemies.filter(x=>x.k===k).length+1;PRIV.enemies.push({k,nome:`${tp.nome} ${cnt}`,atq:tp.atq,def:tp.def,hp:tp.hp,hpMax:tp.hp,dano:tp.dano,nota:tp.nota,ini:tp.ini});savePriv();renderView();return}
    case"ehp":{const en=PRIV.enemies[t.dataset.i];en.hp=clamp(en.hp+v,0,en.hpMax);savePriv();renderView();return}
    case"edano":{const i=t.dataset.i,en=PRIV.enemies[i],n=Number($("#eamt-"+i).value)||0;if(!n)return;const dd=en.k==="militar"?Math.max(1,n-2):n;en.hp=clamp(en.hp-dd,0,en.hpMax);if(en.hp===0)toast(en.nome+" caiu.");savePriv();renderView();return}
    case"eatk":{const en=PRIV.enemies[t.dataset.i];masterRoll(`${en.nome} ataca (vs Defesa)`,1,20,en.atq);return}
    case"edmg":{const en=PRIV.enemies[t.dataset.i];const m=String(en.dano).match(/(\d*)D(\d+)\s*([+-]\d+)?/i);if(!m)return;masterRoll(`${en.nome} · dano`,Number(m[1]||1),Number(m[2]),m[3]?Number(m[3]):0);return}
    case"edel":PRIV.enemies.splice(t.dataset.i,1);savePriv();renderView();return;
    case"eclean":PRIV.enemies=PRIV.enemies.filter(x=>x.hp>0);savePriv();renderView();return;
    case"eclear":PRIV.enemies=[];savePriv();renderView();return;
    default:return;
  }
  savePub();renderTabs();renderView();
});
document.addEventListener("input",e=>{
  const t=e.target,dd=t.dataset;if(!(role==="mestre"&&unlocked))return;
  if(dd.txt){if(PRIV_FIELDS.includes(dd.txt)){PRIV.pcs[dd.id][dd.txt]=t.value;savePriv()}else{PUB.pcs[dd.id][dd.txt]=t.value;savePub()}return}
  if(dd.nf){PRIV.npcs[dd.i][dd.nf]=t.value;savePriv();return}
  if(dd.etxt){PRIV.enemies[dd.i][dd.etxt]=t.value;savePriv();return}
  if(t.id==="pdTxt")pd.texto=t.value;
});
document.addEventListener("change",e=>{
  const t=e.target,dd=t.dataset;if(!(role==="mestre"&&unlocked))return;
  if(dd.num){const c=PUB.pcs[dd.id];let v=Number(t.value);if(isNaN(v))return;if(dd.num==="hpMax"){v=Math.max(1,v);c.hpMax=v;if(c.hp>v)c.hp=v}else c[dd.num]=v;savePub();renderTabs();renderView();return}
  if(dd.nnum){const n=PRIV.npcs[dd.i];n.hpMax=Math.max(1,Number(t.value)||1);if(n.hp>n.hpMax)n.hp=n.hpMax;savePriv();renderView();return}
  if(t.id==="sessao"){PUB.sessao=Math.max(1,Number(t.value)||1);savePub()}
  if(t.id==="hora"){PUB.hora=t.value;savePub();if(t.value.trim()==="03:17")toast("03:17.")}
  if(t.id==="pdDif")pd.dif=t.value;if(t.id==="pdShow")pd.show=t.checked;
});
$("#bkClose").onclick=()=>$("#bkModal").classList.remove("on");
$("#bkCopy").onclick=async()=>{try{await navigator.clipboard.writeText($("#bkText").value);$("#bkMsg").textContent="Copiado."}catch(e){$("#bkText").select();$("#bkMsg").textContent="Selecione o texto e copie com Ctrl+C."}};
$("#bkRestore").onclick=()=>{try{const o=JSON.parse($("#bkText").value);if(o.pub)PUB=mergePub(o.pub);if(o.priv){const pin=PRIV.pinHash;PRIV=mergePriv(o.priv);PRIV.pinHash=pin}savePub();savePriv();renderAll();$("#bkMsg").textContent="Backup restaurado."}catch(e){$("#bkMsg").textContent="Texto inválido."}};
let arm=false;
$("#bkReset").onclick=()=>{if(!arm){arm=true;$("#bkReset").textContent="Clique de novo p/ confirmar";setTimeout(()=>{arm=false;$("#bkReset").textContent="Resetar fichas"},3000);return}
  const pin=PRIV.pinHash,tab=PRIV.tab;PUB=pubDefaults();PRIV=privDefaults();PRIV.pinHash=pin;PRIV.tab=tab;savePub();savePriv();renderAll();arm=false;$("#bkReset").textContent="Resetar fichas";$("#bkMsg").textContent="Fichas voltaram ao início."};
$("#bkClear").onclick=()=>{LOG=[];PRIV.secret=[];myRolls=[];pushPresence();saveLog();savePriv();renderFeeds();$("#bkMsg").textContent="Histórico de rolagens limpo."};

/* ---------- boot ---------- */
renderAll();
if(document.readyState==="loading")document.addEventListener("DOMContentLoaded",initFirebase);else initFirebase();
</script>
</body>
</html>
